<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }
  .game-wrapper {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  canvas {
    border: 3px solid #444;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0, 150, 0, 0.3), 0 0 80px rgba(0, 100, 0, 0.15);
  }
  .info-panel {
    background: #16213e;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 20px;
    color: #8f8;
    min-width: 180px;
    text-align: center;
  }
  .info-panel h2 {
    font-size: 22px;
    margin-bottom: 16px;
    color: #ff0;
    text-shadow: 0 0 10px rgba(255,255,0,0.5);
    letter-spacing: 4px;
  }
  .info-panel .stat {
    margin: 12px 0;
    font-size: 15px;
  }
  .info-panel .stat span {
    color: #fff;
    font-size: 18px;
    font-weight: bold;
  }
  .controls {
    margin-top: 20px;
    font-size: 11px;
    color: #666;
    line-height: 1.8;
  }
  .controls kbd {
    background: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 10px;
    color: #ccc;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="game"></canvas>
  <div class="info-panel" id="panel">
    <h2>坦 克 大 战</h2>
    <div class="stat">🏆 分数<br><span id="score">0</span></div>
    <div class="stat">❤️ 生命<br><span id="lives">3</span></div>
    <div class="stat">🎯 关卡<br><span id="level">1</span></div>
    <div class="stat">💀 剩余<br><span id="enemies">0</span></div>
    <div class="controls">
      <kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 移动<br>
      <kbd>空格</kbd> 射击<br>
      <kbd>R</kbd> 重新开始
    </div>
  </div>
</div>

<script>
// ============ CONSTANTS ============
const COLS = 26;
const ROWS = 26;
const TILE = 24;
const MAP_W = COLS * TILE;
const MAP_H = ROWS * TILE;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = MAP_W;
canvas.height = MAP_H;

// Tile types
const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, GRASS = 4, BASE = 5;

const COLORS = {
  [BRICK]: '#c84c09',
  [STEEL]: '#888',
  [WATER]: '#2266cc',
  [GRASS]: '#2d8a2d',
  [BASE]: '#ff0',
};

const TANK_SIZE = 40;
const HALF_TANK = TANK_SIZE / 2;
const PLAYER_SPEED = 2.5;
const ENEMY_SPEED = 1.0;
const BULLET_SPEED = 5;
const BULLET_SIZE = 4;
const MAX_ENEMIES = 5;
const ENEMY_SPAWN_INTERVAL = 150; // frames
const RESPAWN_DELAY = 90; // frames before player respawns

// Directions
const UP = 0, DOWN = 1, LEFT = 2, RIGHT = 3;
const DIRS = [UP, DOWN, LEFT, RIGHT];
const DIR_VEC = {
  [UP]:    { x: 0,  y: -1 },
  [DOWN]:  { x: 0,  y: 1  },
  [LEFT]:  { x: -1, y: 0  },
  [RIGHT]: { x: 1,  y: 0  },
};

// ============ INPUT ============
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  keys[e.code] = true;
  // Don't preventDefault for all keys (breaks F12 etc), but do for game keys
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyR','KeyJ','KeyF','Enter'].includes(e.code)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

// ============ MAP GENERATION ============
function emptyMap() {
  return Array.from({length: ROWS}, () => new Array(COLS).fill(EMPTY));
}

// Clear a rectangular region of the map to empty (for spawn zones, paths, etc.)
function clearZone(map, colStart, colEnd, rowStart, rowEnd) {
  for (let r = rowStart; r <= rowEnd && r < ROWS; r++) {
    for (let c = colStart; c <= colEnd && c < COLS; c++) {
      if (c >= 0 && c < COLS) map[r][c] = EMPTY;
    }
  }
}

function buildMap(level) {
  const map = emptyMap();

  // === BASE (bottom center) ===
  const bc = Math.floor(COLS / 2); // 13
  map[ROWS - 1][bc] = BASE;
  map[ROWS - 1][bc - 1] = BASE;
  map[ROWS - 1][bc + 1] = BASE;
  map[ROWS - 2][bc] = BASE;

  // Brick wall around base
  map[ROWS - 2][bc - 1] = BRICK;
  map[ROWS - 2][bc + 1] = BRICK;
  map[ROWS - 3][bc - 1] = BRICK;
  map[ROWS - 3][bc] = BRICK;
  map[ROWS - 3][bc + 1] = BRICK;

  // === BORDER ===
  // Top & bottom borders (leave gaps at spawn points)
  for (let c = 1; c < COLS - 1; c++) {
    map[1][c] = BRICK;
    if (level >= 3) map[1][c] = STEEL;
  }
  for (let c = 1; c < COLS - 1; c++) {
    map[ROWS - 4][c] = (level >= 3 && c % 3 === 0) ? STEEL : BRICK;
  }
  // Vertical borders
  for (let r = 1; r < ROWS - 4; r++) {
    map[r][1] = BRICK;
    map[r][COLS - 2] = BRICK;
  }

  // === SPAWN ZONES (guaranteed empty for enemy spawning) ===
  // 3 spawn areas at top: left, center, right
  const spawnCols = [2, bc, COLS - 3];
  for (const sc of spawnCols) {
    clearZone(map, sc - 1, sc + 1, 0, 2);
    // Also add a steel floor under spawn so enemies can ride onto map
    map[2][sc] = EMPTY;
  }

  if (level === 1) {
    // Interior brick rows (with gaps = corridors)
    const rows = [5, 10, 15, 19];
    for (const r of rows) {
      for (let c = 2; c < COLS - 2; c++) {
        if (c % 4 !== 0) map[r][c] = BRICK;
      }
    }
    // Interior brick columns
    const cols = [6, 12, 18];
    for (const c of cols) {
      for (let r = 3; r < ROWS - 5; r++) {
        if (r % 4 !== 2) map[r][c] = BRICK;
      }
    }
    // Steel blocks
    map[5][12] = STEEL;
    map[15][6] = STEEL;
    map[15][18] = STEEL;
    // Water
    for (let c = 7; c < 10; c++) { map[7][c] = WATER; map[8][c] = WATER; }
    for (let c = 16; c < 19; c++) { map[7][c] = WATER; map[8][c] = WATER; }
    // Grass
    for (let c = 3; c < 8; c++) { map[12][c] = GRASS; map[13][c] = GRASS; }
    for (let c = 17; c < 22; c++) { map[12][c] = GRASS; map[13][c] = GRASS; }
    for (let c = 3; c < 8; c++) { map[18][c] = GRASS; map[19][c] = GRASS; }
    for (let c = 17; c < 22; c++) { map[18][c] = GRASS; map[19][c] = GRASS; }
  } else if (level === 2) {
    // Denser brick pattern
    for (let r = 3; r < ROWS - 5; r++) {
      for (let c = 3; c < COLS - 3; c++) {
        if ((r + c) % 5 === 0) map[r][c] = BRICK;
        if ((r * c) % 17 === 0) map[r][c] = STEEL;
      }
    }
    // Clear main corridors
    for (let r = 3; r < ROWS - 4; r++) { clearZone(map, bc, bc + 1, r, r); }
    for (let c = 3; c < COLS - 3; c++) { clearZone(map, c, c, Math.floor(ROWS/2), Math.floor(ROWS/2)+1); }
    // Water pools
    for (let c = 4; c < 8; c++) { map[4][c] = WATER; }
    for (let c = 18; c < 22; c++) { map[4][c] = WATER; }
  } else {
    // Level 3+ - maze-like
    for (let r = 3; r < ROWS - 5; r += 2) {
      for (let c = 3; c < COLS - 3; c++) {
        if (c % 2 === 0) map[r][c] = (level >= 5 && c % 4 === 0) ? STEEL : BRICK;
      }
    }
    for (let c = 3; c < COLS - 3; c += 2) {
      for (let r = 3; r < ROWS - 5; r++) {
        if (r % 2 === 0) map[r][c] = STEEL;
      }
    }
    // Open paths
    clearZone(map, 4, 6, 3, 5);
    clearZone(map, 19, 21, 3, 5);
    clearZone(map, bc - 1, bc + 2, 11, 13);
    clearZone(map, 11, 13, bc - 1, bc + 1);
    // Water
    for (let c = 7; c < 18; c++) {
      if (c !== bc - 1 && c !== bc && c !== bc + 1) {
        map[9][c] = WATER;
      }
    }
  }

  return map;
}

// ============ GAME STATE ============
let map = [];
let player = null;
let enemies = [];
let bullets = [];
let particles = [];
let score = 0;
let lives = 3;
let level = 1;
let totalEnemies = 0;
let spawnedCount = 0;
let spawnTimer = 0;
let state = 'MENU'; // MENU | PLAYING | DYING | LEVEL_CLEAR | GAME_OVER | WIN
let stateTimer = 0;
let shakeTimer = 0;
let shakePower = 0;
let respawnTimer = 0;

// ============ TANK ============
class Tank {
  constructor(x, y, dir, color, speed) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.color = color;
    this.speed = speed;
    this.alive = true;
    this.cooldown = 0;
    this.aiTimer = 0;
    this.frozen = false; // freeze during state transitions
  }

  bounds() {
    return {
      l: this.x - HALF_TANK,
      t: this.y - HALF_TANK,
      r: this.x + HALF_TANK,
      b: this.y + HALF_TANK,
    };
  }

  collidesMap(dx, dy) {
    const b = this.bounds();
    const check = (cx, cy) => {
      const col = Math.floor(cx / TILE);
      const row = Math.floor(cy / TILE);
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;
      const t = map[row][col];
      return t === BRICK || t === STEEL || t === BASE || t === WATER;
    };
    return check(b.l + dx, b.t + dy) ||
           check(b.r + dx, b.t + dy) ||
           check(b.l + dx, b.b + dy) ||
           check(b.r + dx, b.b + dy);
  }

  collidesTank(dx, dy, other) {
    if (!other || !other.alive || other === this) return false;
    const a = this.bounds();
    const an = { l: a.l + dx, t: a.t + dy, r: a.r + dx, b: a.b + dy };
    const b = other.bounds();
    return an.l < b.r && an.r > b.l && an.t < b.b && an.b > b.t;
  }

  collidesAnyTank(dx, dy) {
    // Check collision with all other alive tanks (player + enemies)
    if (player && player !== this && player.alive && this.collidesTank(dx, dy, player)) return true;
    for (const e of enemies) {
      if (e !== this && e.alive && this.collidesTank(dx, dy, e)) return true;
    }
    return false;
  }

  move(dx, dy) {
    if (dx === 0 && dy === 0) return true;
    // Try full movement
    if (!this.collidesMap(dx, dy) && !this.collidesAnyTank(dx, dy)) {
      this.x += dx;
      this.y += dy;
      return true;
    }
    // Try sliding
    if (dx !== 0 && !this.collidesMap(dx, 0) && !this.collidesAnyTank(dx, 0)) {
      this.x += dx;
      return true;
    }
    if (dy !== 0 && !this.collidesMap(0, dy) && !this.collidesAnyTank(0, dy)) {
      this.y += dy;
      return true;
    }
    return false;
  }

  shoot() {
    if (this.cooldown > 0) return null;
    this.cooldown = 18;
    const v = DIR_VEC[this.dir];
    return new Bullet(
      this.x + v.x * (HALF_TANK + 3),
      this.y + v.y * (HALF_TANK + 3),
      this.dir,
      this === player
    );
  }

  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    const cx = this.x, cy = this.y, h = HALF_TANK;

    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(cx - h + 2, cy - h + 2, TANK_SIZE - 4, TANK_SIZE - 4);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - h + 2, cy - h + 2, TANK_SIZE - 4, TANK_SIZE - 4);

    // Tracks
    ctx.fillStyle = '#2a2a2a';
    if (this.dir === UP || this.dir === DOWN) {
      ctx.fillRect(cx - h, cy - h, 5, TANK_SIZE);
      ctx.fillRect(cx + h - 5, cy - h, 5, TANK_SIZE);
    } else {
      ctx.fillRect(cx - h, cy - h, TANK_SIZE, 5);
      ctx.fillRect(cx - h, cy + h - 5, TANK_SIZE, 5);
    }

    // Barrel
    ctx.fillStyle = this.color;
    const v = DIR_VEC[this.dir];
    const bw = 5;
    const bl = h + 6;
    if (this.dir === UP) {
      ctx.fillRect(cx - bw/2, cy - h - 2, bw, bl);
    } else if (this.dir === DOWN) {
      ctx.fillRect(cx - bw/2, cy + h - bl + 2, bw, bl);
    } else if (this.dir === LEFT) {
      ctx.fillRect(cx - h - 2, cy - bw/2, bl, bw);
    } else {
      ctx.fillRect(cx + h - bl + 2, cy - bw/2, bl, bw);
    }

    // Turret dome
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }
}

// ============ BULLET ============
class Bullet {
  constructor(x, y, dir, fromPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.fromPlayer = fromPlayer;
    this.alive = true;
  }

  update() {
    const v = DIR_VEC[this.dir];
    this.x += v.x * BULLET_SPEED;
    this.y += v.y * BULLET_SPEED;

    // Off-screen
    if (this.x < -4 || this.x > MAP_W + 4 || this.y < -4 || this.y > MAP_H + 4) {
      this.alive = false;
      return;
    }

    // Tile hit
    const col = Math.floor(this.x / TILE);
    const row = Math.floor(this.y / TILE);
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      const tile = map[row][col];
      if (tile === BRICK) {
        map[row][col] = EMPTY;
        this.alive = false;
        spawnParticles(col * TILE + TILE/2, row * TILE + TILE/2, '#c84c09', 6);
      } else if (tile === STEEL) {
        this.alive = false;
        spawnParticles(this.x, this.y, '#aaa', 3);
      } else if (tile === BASE) {
        this.alive = false;
        blowUpBase();
      }
    }
  }

  hitbox() {
    return {
      l: this.x - BULLET_SIZE/2, t: this.y - BULLET_SIZE/2,
      r: this.x + BULLET_SIZE/2, b: this.y + BULLET_SIZE/2,
    };
  }

  draw(ctx) {
    if (!this.alive) return;
    ctx.fillStyle = this.fromPlayer ? '#ff0' : '#f66';
    ctx.shadowColor = this.fromPlayer ? '#ff0' : '#f00';
    ctx.shadowBlur = 5;
    ctx.fillRect(this.x - BULLET_SIZE/2, this.y - BULLET_SIZE/2, BULLET_SIZE, BULLET_SIZE);
    ctx.shadowBlur = 0;
  }
}

// ============ PARTICLES ============
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, color,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5 - 3,
      life: 12 + Math.random() * 16,
      max: 28,
      size: 2 + Math.random() * 3,
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawParticles(ctx) {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ============ SPAWNING ============
function spawnPlayer() {
  // Place player well above the base, centered horizontally
  const cx = Math.floor(COLS / 2) * TILE + TILE / 2;
  const cy = (ROWS - 6) * TILE + TILE / 2;
  const p = new Tank(cx, cy, UP, '#4a4', PLAYER_SPEED);
  // Verify spawn is clear; if not, try adjacent positions
  if (p.collidesMap(0, 0) || p.collidesAnyTank(0, 0)) {
    // Try moving left
    for (let offset = 1; offset < 8; offset++) {
      p.x -= TILE;
      if (!p.collidesMap(0, 0) && !p.collidesAnyTank(0, 0)) break;
      p.x += TILE * 2;
      if (!p.collidesMap(0, 0) && !p.collidesAnyTank(0, 0)) break;
      p.x -= TILE;
    }
  }
  return p;
}

function spawnEnemy() {
  // 3 spawn points at top of map (in cleared zones)
  const sx = [2, Math.floor(COLS/2), COLS - 3];
  const sy = 1.5; // center at row 1.5 (y = 36)
  const spawns = sx.map(c => ({
    x: c * TILE + TILE / 2,
    y: sy * TILE,
  }));

  // Shuffle to randomize
  for (let i = spawns.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [spawns[i], spawns[j]] = [spawns[j], spawns[i]];
  }

  for (const sp of spawns) {
    const e = new Tank(sp.x, sp.y, DOWN, '#e44', ENEMY_SPEED + level * 0.1);
    if (!e.collidesMap(0, 0) && !e.collidesAnyTank(0, 0)) {
      e.aiTimer = 40 + Math.random() * 80;
      return e;
    }
  }
  return null;
}

// ============ GAME EVENTS ============
function killPlayer() {
  if (!player || !player.alive) return;
  player.alive = false;
  spawnParticles(player.x, player.y, '#4a4', 12);
  lives--;
  shakeTimer = 16;
  shakePower = 4;

  if (lives <= 0) {
    state = 'GAME_OVER';
    stateTimer = 0;
  } else {
    respawnTimer = RESPAWN_DELAY;
  }
  updateUI();
}

function blowUpBase() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (map[r][c] === BASE) {
        spawnParticles(c * TILE + TILE/2, r * TILE + TILE/2, '#ff0', 20);
        map[r][c] = EMPTY;
      }
    }
  }
  shakeTimer = 30;
  shakePower = 8;
  player.alive = false;
  lives = 0;
  state = 'GAME_OVER';
  stateTimer = 0;
  updateUI();
}

function startLevel() {
  enemies = [];
  bullets = [];
  particles = [];
  spawnedCount = 0;
  totalEnemies = 4 + level * 2;
  spawnTimer = 30; // brief delay before first enemy
  player = spawnPlayer();
  respawnTimer = 0;
  stateTimer = 0;
  state = 'PLAYING';
  updateUI();
}

function goNextLevel() {
  level++;
  if (level > 5) {
    state = 'WIN';
    stateTimer = 0;
    return;
  }
  map = buildMap(level);
  startLevel();
}

function restart() {
  score = 0;
  lives = 3;
  level = 1;
  map = buildMap(1);
  enemies = [];
  bullets = [];
  particles = [];
  spawnedCount = 0;
  totalEnemies = 4 + level * 2;
  spawnTimer = 30;
  player = spawnPlayer();
  respawnTimer = 0;
  shakeTimer = 0;
  state = 'PLAYING';
  stateTimer = 0;
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = Math.max(0, lives);
  document.getElementById('level').textContent = level;
  const remain = totalEnemies - spawnedCount + enemies.filter(e => e.alive).length;
  document.getElementById('enemies').textContent = Math.max(0, remain);
}

// ============ MAIN UPDATE ============
function update() {
  // ---- Handle non-PLAYING states ----
  if (state === 'MENU') {
    if (keys['Space'] || keys['Enter']) {
      keys['Space'] = false;
      keys['Enter'] = false;
      restart();
    }
    return;
  }

  if (state === 'LEVEL_CLEAR') {
    stateTimer++;
    if (stateTimer > 120) goNextLevel();
    return;
  }

  if (state === 'GAME_OVER' || state === 'WIN') {
    stateTimer++;
    if (keys['KeyR']) {
      keys['KeyR'] = false;
      restart();
    }
    return;
  }

  if (state !== 'PLAYING') return;

  // ---- PLAYING state ----
  stateTimer++;

  // Handle player respawn
  if (respawnTimer > 0) {
    respawnTimer--;
    if (respawnTimer === 0) {
      player = spawnPlayer();
    }
  }

  // Spawn enemies
  if (spawnedCount < totalEnemies && enemies.filter(e => e.alive).length < MAX_ENEMIES) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      const e = spawnEnemy();
      if (e) {
        enemies.push(e);
        spawnedCount++;
      }
      spawnTimer = ENEMY_SPAWN_INTERVAL;
    }
  }

  // Level complete check
  if (spawnedCount >= totalEnemies && enemies.every(e => !e.alive)) {
    state = 'LEVEL_CLEAR';
    stateTimer = 0;
    return;
  }

  // ---- Update player ----
  if (player && player.alive) {
    // Direction input
    let dx = 0, dy = 0;
    if (keys['ArrowUp']    || keys['KeyW']) { dy = -player.speed; player.dir = UP; }
    else if (keys['ArrowDown']  || keys['KeyS']) { dy =  player.speed; player.dir = DOWN; }
    else if (keys['ArrowLeft']  || keys['KeyA']) { dx = -player.speed; player.dir = LEFT; }
    else if (keys['ArrowRight'] || keys['KeyD']) { dx =  player.speed; player.dir = RIGHT; }

    player.move(dx, dy);
    player.cooldown = Math.max(0, player.cooldown - 1);

    // Shoot
    if ((keys['Space'] || keys['KeyJ'] || keys['KeyF']) && player.cooldown <= 0) {
      const b = player.shoot();
      if (b) bullets.push(b);
    }
  }

  // ---- Update enemies ----
  for (const e of enemies) {
    if (!e.alive) continue;
    e.cooldown = Math.max(0, e.cooldown - 1);
    e.aiTimer--;

    // Change direction periodically or when stuck
    if (e.aiTimer <= 0) {
      // Sometimes chase player at higher levels
      if (player && player.alive && Math.random() < 0.25 + level * 0.06) {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        e.dir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? RIGHT : LEFT)
          : (dy > 0 ? DOWN : UP);
      } else {
        e.dir = DIRS[Math.floor(Math.random() * 4)];
      }
      e.aiTimer = 35 + Math.random() * 80;
    }

    // Move
    const v = DIR_VEC[e.dir];
    const moved = e.move(v.x * e.speed, v.y * e.speed);
    if (!moved) e.aiTimer = Math.min(e.aiTimer, 8); // bump → rethink soon

    // Shoot
    if (e.cooldown <= 0 && Math.random() < 0.018 + level * 0.004) {
      const b = e.shoot();
      if (b) bullets.push(b);
    }

    // Enemy touches player
    if (player && player.alive) {
      if (e.collidesTank(0, 0, player)) {
        killPlayer();
      }
    }
  }

  // ---- Update bullets ----
  for (const b of bullets) b.update();

  // ---- Bullet collisions ----
  for (const b of bullets) {
    if (!b.alive) continue;
    const hb = b.hitbox();

    // Hit tanks
    if (b.fromPlayer) {
      for (const e of enemies) {
        if (!e.alive) continue;
        const eb = e.bounds();
        if (hb.l < eb.r && hb.r > eb.l && hb.t < eb.b && hb.b > eb.t) {
          e.alive = false;
          b.alive = false;
          spawnParticles(e.x, e.y, '#e44', 14);
          score += 100;
          break;
        }
      }
    } else {
      // Enemy bullet hits player
      if (player && player.alive) {
        const pb = player.bounds();
        if (hb.l < pb.r && hb.r > pb.l && hb.t < pb.b && hb.b > pb.t) {
          b.alive = false;
          killPlayer();
        }
      }
    }

    // Bullet vs bullet
    if (b.alive) {
      for (const o of bullets) {
        if (o === b || !o.alive) continue;
        if (b.fromPlayer === o.fromPlayer) continue;
        const oh = o.hitbox();
        if (hb.l < oh.r && hb.r > oh.l && hb.t < oh.b && hb.b > oh.t) {
          b.alive = false;
          o.alive = false;
          spawnParticles((b.x + o.x) / 2, (b.y + o.y) / 2, '#fff', 4);
        }
      }
    }
  }

  // ---- Cleanup ----
  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);

  // ---- Particles & shake ----
  updateParticles();
  if (shakeTimer > 0) shakeTimer--;

  updateUI();
}

// ============ RENDER ============
function drawMap() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tile = map[r][c];
      if (tile === EMPTY || tile === GRASS) continue;
      const x = c * TILE, y = r * TILE;

      if (tile === BASE) {
        ctx.fillStyle = '#222';
        ctx.fillRect(x, y, TILE, TILE);
        // Eagle
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.moveTo(x + TILE/2, y + 3);
        ctx.lineTo(x + TILE - 2, y + TILE - 3);
        ctx.lineTo(x + TILE/2, y + TILE - 8);
        ctx.lineTo(x + 2, y + TILE - 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        ctx.fillStyle = COLORS[tile];
        ctx.fillRect(x, y, TILE, TILE);

        if (tile === BRICK) {
          ctx.strokeStyle = '#a03';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
          ctx.beginPath();
          ctx.moveTo(x, y + TILE/2);
          ctx.lineTo(x + TILE, y + TILE/2);
          ctx.moveTo(x + TILE/2, y);
          ctx.lineTo(x + TILE/2, y + TILE);
          ctx.stroke();
        } else if (tile === STEEL) {
          const g = ctx.createLinearGradient(x, y, x + TILE, y + TILE);
          g.addColorStop(0, '#aaa');
          g.addColorStop(0.5, '#666');
          g.addColorStop(1, '#999');
          ctx.fillStyle = g;
          ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
          ctx.strokeStyle = '#444';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
        } else if (tile === WATER) {
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fillRect(x + 2, y + 4, TILE - 4, 2);
          ctx.fillRect(x + 4, y + 10, TILE - 8, 2);
          ctx.fillRect(x + 2, y + 16, TILE - 4, 2);
        }
      }
    }
  }
}

// Deterministic grass positions using grid coords
const grassCache = {};
function getGrassBlades(r, c) {
  const key = `${r},${c}`;
  if (!grassCache[key]) {
    grassCache[key] = [];
    for (let i = 0; i < 4; i++) {
      // Pseudo-random based on position
      const h = ((r * 31 + c * 17 + i * 53) % 100) / 100;
      grassCache[key].push({
        baseX: c * TILE + 4 + i * 6,
        sway: h > 0.5 ? 2 : -2,
        height: 4 + h * 8,
      });
    }
  }
  return grassCache[key];
}

function drawGrass() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (map[r][c] !== GRASS) continue;
      const x = c * TILE, y = r * TILE;
      ctx.fillStyle = '#2d8a2d';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.strokeStyle = '#3a7a3a';
      ctx.lineWidth = 0.8;
      for (const blade of getGrassBlades(r, c)) {
        ctx.beginPath();
        ctx.moveTo(blade.baseX, y + TILE);
        ctx.quadraticCurveTo(blade.baseX + blade.sway, y + TILE/2, blade.baseX, y + TILE - blade.height);
        ctx.stroke();
      }
    }
  }
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, MAP_W, MAP_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 46px "Courier New", monospace';
  ctx.fillText(title, MAP_W / 2, MAP_H / 2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '16px "Courier New", monospace';
  ctx.fillText(subtitle, MAP_W / 2, MAP_H / 2 + 45);
  ctx.textAlign = 'start';
}

function drawMenu() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, MAP_W, MAP_H);
  drawMap();

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 50px "Courier New", monospace';
  ctx.shadowColor = '#f80';
  ctx.shadowBlur = 20;
  ctx.fillText('坦 克 大 战', MAP_W / 2, MAP_H / 3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#0f0';
  ctx.font = '20px "Courier New", monospace';
  ctx.fillText('TANK BATTLE', MAP_W / 2, MAP_H / 3 + 44);

  const pulse = Math.sin(Date.now() / 600) * 0.35 + 0.75;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fff';
  ctx.font = '18px "Courier New", monospace';
  ctx.fillText('按 空格键 或 Enter 开始', MAP_W / 2, MAP_H / 2 + 30);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#999';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText('保护基地 🦅  消灭敌人', MAP_W / 2, MAP_H / 2 + 70);
  ctx.fillText('↑↓←→ / WASD 移动 · 空格 射击', MAP_W / 2, MAP_H / 2 + 92);

  ctx.textAlign = 'start';
}

function render() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Screen shake
  let sx = 0, sy = 0;
  if (shakeTimer > 0) {
    sx = (Math.random() - 0.5) * shakePower * (shakeTimer / 30);
    sy = (Math.random() - 0.5) * shakePower * (shakeTimer / 30);
  }
  ctx.save();
  ctx.translate(sx, sy);

  if (state === 'MENU') {
    drawMenu();
    ctx.restore();
    return;
  }

  drawMap();

  // Entities
  if (player && player.alive) player.draw(ctx);
  for (const e of enemies) e.draw(ctx);
  for (const b of bullets) b.draw(ctx);
  drawParticles(ctx);

  // Grass over everything
  drawGrass();

  ctx.restore();

  // Overlays
  if (state === 'LEVEL_CLEAR') {
    drawOverlay('🎉 关卡完成！', level >= 5 ? '最终关卡通过！' : `即将进入第 ${level + 1} 关...`);
  } else if (state === 'GAME_OVER') {
    drawOverlay('💀 游戏结束', `得分: ${score}  |  按 R 重玩`);
  } else if (state === 'WIN') {
    drawOverlay('🏆 恭喜通关！', `总得分: ${score}  |  按 R 重玩`);
  }
}

// ============ GAME LOOP ============
function loop() {
  update();

  // Handle restart from any state via R key
  if (keys['KeyR'] && state !== 'MENU' && state !== 'PLAYING') {
    keys['KeyR'] = false;
    restart();
  }

  render();
  updateUI();
  requestAnimationFrame(loop);
}

// ============ INIT ============
map = buildMap(1);
updateUI();
loop();
</script>
